<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portál stavební správy - REZA Prototyp</title>
    <style>
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2362a2 0%, #1a4a7a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            width: 80px;
            margin-bottom: 24px;
        }
        h1 {
            color: #1a1a1a;
            font-size: 24px;
            margin-bottom: 8px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 32px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            text-decoration: none;
            margin-bottom: 12px;
        }
        .btn-primary {
            background: #2362a2;
            color: white;
        }
        .btn-primary:hover {
            background: #1a4a7a;
        }
        .btn-secondary {
            background: #e9ecef;
            color: #333;
        }
        .btn-secondary:hover {
            background: #dee2e6;
        }
        .divider {
            margin: 24px 0;
            color: #999;
            font-size: 14px;
        }
        .info {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #eee;
            font-size: 13px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="images/logo-lev.png" alt="Státní znak" class="logo" style="filter: none; background: #2362a2; padding: 12px; border-radius: 8px;">
        <h1>Portál stavební správy</h1>
        <p class="subtitle">REZA Prototyp</p>
        
        <a href="pages/reza-new.html" class="btn btn-primary">Přihlásit se přes Identity občana</a>
        <a href="pages/reza-new.html" class="btn btn-secondary">Přihlásit se přes Bankovní identitu</a>
        
        <p class="divider">— nebo —</p>
        
        <a href="pages/reza-new.html" class="btn btn-secondary">Demo: Nová plná moc</a>
        
        <div class="info">
            Prototyp pro testování REZA<br>
            (Registr elektronických zastupování)
        </div>
    </div>
</body>
</html>
